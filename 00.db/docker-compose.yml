name: backend-1-1_thai
services:
  postgres-db:
    image: postgres:17-alpine
    container_name: postgres_17_container
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis
    container_name: thai_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
